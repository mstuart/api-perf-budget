name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
          - 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      # ava@8 (see devDependencies) declares engines.node "^22.20 || ^24.12 || >=26"
      # and refuses to run at all on Node 20, so that leg can never pass here.
      # Keep it in the matrix for visibility but don't block merges on it.
      - run: npm test
        continue-on-error: ${{ matrix.node-version == 20 }}
